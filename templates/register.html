{% extends "base.html" %}
{% block title %}Sign Up – UC Lost & Found{% endblock %}
{% block content %}
<div class="form-container">
  <h2>Create an Account</h2>
  <form method="POST" action="{{ url_for('register') }}">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}"/>{% endif %}

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="e.g. bearcatjoe" autocomplete="username"
             pattern="[A-Za-z0-9_.\-]{3,30}" minlength="3" maxlength="30" required
             aria-describedby="username-hint" />
      <small id="username-hint" class="field-hint">This is how other students will see you. 3–30 letters, numbers, _ . or - (no spaces).</small>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="yourname@mail.uc.edu" autocomplete="email" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Choose a strong password" autocomplete="new-password" required />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Account</button>
    </div>

    <p class="form-footer">Already have an account? <a href="{{ url_for('login', next=next_url) }}">Log in</a></p>
  </form>
</div>
{% endblock %}
